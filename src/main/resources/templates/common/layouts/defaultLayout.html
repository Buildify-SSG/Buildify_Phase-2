<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <title layout:title-pattern="$TITLE - Buildify">Buildify</title>
    <link th:href="@{/css/app.css}" rel="stylesheet">
    <link th:href="@{/css/custom.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="wrapper">
    <div th:replace="~{common/fragments/sidebar :: sidebarFragment}"></div>
    <div class="main">
        <div th:replace="~{common/fragments/header :: headerFragment}"></div>

        <main class="content" layout:fragment="content">
            <!-- 여기에 콘텐츠 삽입됨 -->
        </main>

        <div th:replace="~{common/fragments/footer :: footerFragment}"></div>
    </div>
</div>
<script th:src="@{/js/app.js}"></script>
<script>
    if (typeof feather !== 'undefined') {
        feather.replace();
    }
</script>
</body>
</html>
