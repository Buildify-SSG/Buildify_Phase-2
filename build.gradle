plugins {
	id 'java'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.buildify'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework:spring-context:6.1.4'
	implementation 'org.springframework:spring-webmvc:6.1.4'
	implementation 'org.springframework:spring-jdbc:6.1.4'
	implementation 'org.springframework:spring-orm:6.1.4'
	implementation 'org.springframework:spring-tx:6.1.4'
	implementation 'org.springframework:spring-test:6.1.4'
	implementation 'org.springframework:spring-web:6.1.4'
	implementation 'org.springframework:spring-beans:6.1.4'
	implementation 'org.springframework:spring-core:6.1.4'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	implementation 'org.mybatis:mybatis:3.5.15'
	implementation 'org.mybatis:mybatis-spring:3.0.3'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
	implementation 'javax.servlet:jstl:1.2'
	implementation 'org.apache.tomcat.embed:tomcat-embed-jasper:9.0.87'
}
